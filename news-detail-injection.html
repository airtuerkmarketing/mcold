<!-- ============================================================
     news-detail-injection — Styles for the modal inner page
     Inject via <style> tag override in the news-detail SX page
     OR include in the page's <style sx-id="..."> block.

     These styles replace the existing news-detail component CSS
     to produce a full-width media-first layout inside the modal.
     ============================================================ -->

<style id="mcx-news-detail-override">

/* ── Reset page chrome inside modal ── */
[sx-page="news-detail"] { overflow: hidden; }
#multicheck {
  overflow-y: auto;
  height: 100%;
  padding-right: 0 !important;
  scrollbar-width: thin;
  scrollbar-color: #ccc transparent;
}
#multicheck::-webkit-scrollbar       { width: 4px; }
#multicheck::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

/* ── Outer wrapper ── */
.mcx-news-detail-component {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  font-family: inherit;
}

/* ── Full-width media hero ── */
.mcx-news-detail-image {
  width: 100%;
  height: clamp(200px, 38vh, 320px);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  flex-shrink: 0;
  /* remove old constraints */
  max-height: none !important;
}
.mcx-news-detail-image img.mcx-baner {
  width: 100% !important;
  max-width: 100% !important;
  height: 100%;
  max-height: none !important;
  object-fit: cover;
  display: block;
}

/* ── Content area ── */
.mcx-content {
  padding: 24px 28px 20px;
  flex: 1;
}
.mcx-content h4 {
  font-size: 18px;
  font-weight: 700;
  color: #111;
  margin: 0 0 12px;
  line-height: 1.3;
}
.mcx-content p {
  font-size: 14px;
  line-height: 1.75;
  color: #444;
  margin-bottom: 8px;
  white-space: pre-line;
}
.mcx-content a {
  color: #246bb3;
  text-decoration: underline;
  font-weight: 600;
}
.mcx-content a:hover { text-decoration: none; }

/* ── Embedded video — full-width, placed FIRST inside .mcx-content ── */
.mcx-video-wrapper {
  position: relative;
  width: calc(100% + 56px);     /* bleed past .mcx-content padding */
  margin-left: -28px;
  margin-right: -28px;
  margin-top: -24px;             /* pull up to top of content area  */
  margin-bottom: 20px;
  aspect-ratio: 16 / 9;
  background: #000;
  order: -1;                     /* move before text in flex flow   */
}
/* When a video wrapper exists, show it as the hero instead of the image */
.mcx-content:has(.mcx-video-wrapper) + .mcx-news-detail-image,
.mcx-news-detail-image:has(+ .mcx-content .mcx-video-wrapper) {
  display: none;
}
.mcx-video-wrapper .mcx-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Rearrange: video first, text below */
.mcx-content {
  display: flex;
  flex-direction: column;
}
.mcx-video-wrapper { order: -1; }

/* ── Date footer ── */
.mcx-news-detail-component > div[style*="opacity"] {
  padding: 8px 28px 20px !important;
  font-size: 12px;
  color: #999;
  opacity: 0.7;
}

</style>
